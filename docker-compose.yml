# ---------------------------------------------------------------------------
# PostgreSQL for the Sethos Store backend.
#
#   docker compose up -d                      # database only
#   docker compose --profile tools up -d      # database + pgAdmin on :5050
#
# Then start the API with the matching profile:
#   cd pos-backend && ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
#
# The default (no profile) backend uses H2 instead and needs none of this.
# ---------------------------------------------------------------------------

# Fixed project name so containers, network and volumes are named after the store
# rather than whatever folder this file happens to sit in.
name: sethos-store

services:
  postgres:
    # Pinned to an exact patch so every machine gets the same engine.
    image: postgres:18.6-alpine
    container_name: sethos-store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: posdb
      POSTGRES_USER: posuser
      # Local development credential. Override via a .env file or your secret
      # manager before this goes anywhere near a shared environment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pospassword}
      # Slightly faster and more predictable collation behaviour than the default.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ images expect the volume at /var/lib/postgresql, not at
      # /var/lib/postgresql/data: data now lives in a version-named subdirectory so
      # `pg_upgrade --link` works without crossing a mount boundary. Mounting the old
      # path makes the container refuse to start.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # The API can wait on this instead of racing a database that is still starting.
      test: ["CMD-SHELL", "pg_isready -U posuser -d posdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9.18.0
    container_name: sethos-store-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sethos.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin

# Prefixed with the project name by Compose: sethos-store_pgdata, sethos-store_pgadmin-data.
volumes:
  pgdata:
  pgadmin-data:
