# ---------------------------------------------------------------------------
# Sethos Store CI/CD
#
# Pull request to main  -> test and build both images, push nothing
# Push to main          -> test, build and push changed images as :latest and :sha-xxxxxxx
# Push a tag v1.2.3     -> build and push both images as :1.2.3 and :1.2
# Manual run            -> build and push both images
#
# Only a service whose folder changed is rebuilt on main, so a README edit costs nothing.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME  Docker Hub account name
#   DOCKERHUB_TOKEN     Docker Hub access token with Read & Write scope
# Optional repository variable:
#   DOCKERHUB_NAMESPACE Push under an organisation instead of the account name
# ---------------------------------------------------------------------------

name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only needs to read the code. Docker Hub is reached
# with its own token, not the GitHub token.
permissions:
  contents: read

# A newer push to the same PR supersedes the older run. Runs on main are never
# cancelled mid-publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Secret values are masked in logs, so the namespace can come from a plain variable
  # when you want readable image names in the run output.
  IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
  # Pull requests from forks get no secrets, and nothing should publish from a PR anyway.
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  # -------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # A workflow edit rebuilds everything, so pipeline changes are always exercised.
          filters: |
            backend:
              - 'pos-backend/**'
              - '.github/workflows/**'
            frontend:
              - 'pos-frontend/**'
              - '.github/workflows/**'

  # -------------------------------------------------------------------------
  backend:
    name: Backend
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true'
      || startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pos-backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # The Dockerfile skips tests to keep image builds fast, so they run here instead.
      # An image is only built from code that passed.
      - name: Test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: pos-backend/target/surefire-reports/
          retention-days: 7

      - name: Check Docker Hub credentials
        if: env.PUBLISH == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets are required to publish."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ env.IMAGE_NAMESPACE || 'local' }}/sethos-store-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: pos-backend
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in GitHub's cache service: an unchanged pom means dependencies
          # are not downloaded again.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: mode=max
          sbom: true

  # -------------------------------------------------------------------------
  frontend:
    name: Frontend
    needs: changes
    if: >-
      needs.changes.outputs.frontend == 'true'
      || startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check Docker Hub credentials
        if: env.PUBLISH == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets are required to publish."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ env.IMAGE_NAMESPACE || 'local' }}/sethos-store-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      # The Angular production build runs inside the image, so a compile error fails here.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: pos-frontend
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: mode=max
          sbom: true
